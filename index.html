<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="referrer" content="origin-when-cross-origin">
<title>Flip Map</title>
<style>
  /* Layout: full-screen map with a thin status bar on top and bottom.
     Built for a 240x320 keypad phone screen. Plain old CSS/JS so older
     browsers can run it. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #1d2330; color: #f2f4f8; font-family: Arial, Helvetica, sans-serif; }
  #bar-top, #bar-bot { position: absolute; left: 0; right: 0; height: 22px; line-height: 22px;
    background: #10141d; font-size: 13px; padding: 0 4px; z-index: 5; white-space: nowrap; overflow: hidden; }
  #bar-top { top: 0; }
  #bar-bot { bottom: 0; }
  #map { position: absolute; left: 0; right: 0; top: 22px; bottom: 22px; overflow: hidden; background: #cfd8e3; }
  #tiles { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #tiles img { position: absolute; width: 256px; height: 256px; border: 0; }
  #me { position: absolute; width: 16px; height: 16px; margin: -9px 0 0 -9px; border-radius: 50%;
    background: #1a73e8; border: 2px solid #fff; z-index: 3; display: none; }
  #cross { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; z-index: 2; opacity: .6; }
  #cross:before, #cross:after { content: ""; position: absolute; background: #222; }
  #cross:before { left: 6px; top: 0; width: 2px; height: 14px; }
  #cross:after { left: 0; top: 6px; width: 14px; height: 2px; }
  #credit { position: absolute; right: 2px; bottom: 24px; font-size: 9px; background: rgba(255,255,255,.8);
    color: #222; padding: 0 3px; z-index: 4; }
  #help { position: absolute; left: 0; right: 0; top: 22px; bottom: 22px; z-index: 6; background: rgba(16,20,29,.94);
    font-size: 14px; line-height: 1.5; padding: 10px; display: none; }
  #help b { color: #8ab4ff; }
</style>
</head>
<body>
<div id="bar-top">Starting…</div>
<div id="map">
  <div id="tiles"></div>
  <div id="cross"></div>
  <div id="me"></div>
  <div id="credit">&copy; OpenStreetMap</div>
</div>
<div id="bar-bot">Waiting for GPS…</div>
<div id="help">
  <b>Keys</b><br>
  Arrows: move map<br>
  1: zoom in &nbsp; 3: zoom out<br>
  5 / OK: center on me<br>
  0: follow me on/off<br>
  * : show / hide this help<br><br>
  Needs data and location turned on.
</div>

<script>
(function () {
  var TILE = 256;
  var tilesEl = document.getElementById('tiles');
  var mapEl = document.getElementById('map');
  var meEl = document.getElementById('me');
  var topEl = document.getElementById('bar-top');
  var botEl = document.getElementById('bar-bot');
  var helpEl = document.getElementById('help');

  // Start roughly over Gilbert, AZ until the GPS gives a fix.
  var view = { lat: 33.3528, lon: -111.789, z: 15 };
  var me = null;          // latest GPS fix
  var follow = true;
  var cache = {};         // "z/x/y" -> <img>

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // Web Mercator: lat/lon -> world pixel at zoom z
  function toPx(lat, lon, z) {
    var scale = TILE * Math.pow(2, z);
    var s = Math.sin(clamp(lat, -85.05, 85.05) * Math.PI / 180);
    return {
      x: (lon + 180) / 360 * scale,
      y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * scale
    };
  }
  function toLatLon(x, y, z) {
    var scale = TILE * Math.pow(2, z);
    var lon = x / scale * 360 - 180;
    var n = Math.PI - 2 * Math.PI * y / scale;
    var lat = 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    return { lat: lat, lon: lon };
  }

  function render() {
    var w = mapEl.clientWidth, h = mapEl.clientHeight;
    var c = toPx(view.lat, view.lon, view.z);
    var left = c.x - w / 2, top = c.y - h / 2;
    var n = Math.pow(2, view.z);
    var x0 = Math.floor(left / TILE), x1 = Math.floor((left + w) / TILE);
    var y0 = Math.floor(top / TILE),  y1 = Math.floor((top + h) / TILE);
    var needed = {}, x, y, key, img;

    for (x = x0; x <= x1; x++) {
      for (y = y0; y <= y1; y++) {
        if (y < 0 || y >= n) continue;
        var wx = ((x % n) + n) % n;
        key = view.z + '/' + wx + '/' + y + '@' + x;
        needed[key] = true;
        img = cache[key];
        if (!img) {
          img = document.createElement('img');
          img.src = 'https://tile.openstreetmap.org/' + view.z + '/' + wx + '/' + y + '.png';
          img.alt = '';
          tilesEl.appendChild(img);
          cache[key] = img;
        }
        img.style.left = Math.round(x * TILE - left) + 'px';
        img.style.top = Math.round(y * TILE - top) + 'px';
      }
    }
    for (key in cache) {
      if (!needed[key]) { tilesEl.removeChild(cache[key]); delete cache[key]; }
    }

    // GPS dot
    if (me) {
      var p = toPx(me.lat, me.lon, view.z);
      var sx = p.x - left, sy = p.y - top;
      meEl.style.left = Math.round(sx) + 'px';
      meEl.style.top = Math.round(sy) + 'px';
      meEl.style.display = (sx >= -8 && sx <= w + 8 && sy >= -8 && sy <= h + 8) ? 'block' : 'none';
    }
    status();
  }

  function status() {
    topEl.textContent = 'Zoom ' + view.z + (follow ? '  Following' : '  Free') + '  (* help)';
    if (!me) { return; }
    var mph = me.speed != null && !isNaN(me.speed) ? Math.round(me.speed * 2.23694) : null;
    var ft = me.acc != null ? Math.round(me.acc * 3.281) : null;
    botEl.textContent = (mph !== null ? mph + ' mph  ' : '') + (ft !== null ? '±' + ft + ' ft  ' : '') +
      me.lat.toFixed(4) + ', ' + me.lon.toFixed(4);
  }

  function pan(dx, dy) {
    var c = toPx(view.lat, view.lon, view.z);
    var ll = toLatLon(c.x + dx, c.y + dy, view.z);
    view.lat = clamp(ll.lat, -85, 85);
    view.lon = ll.lon;
    follow = false;
    render();
  }
  function zoom(d) {
    view.z = clamp(view.z + d, 3, 18);
    render();
  }
  function center() {
    if (me) { view.lat = me.lat; view.lon = me.lon; follow = true; render(); }
    else { botEl.textContent = 'No GPS fix yet'; }
  }

  document.onkeydown = function (e) {
    e = e || window.event;
    var k = e.key, code = e.keyCode, step = 64, used = true;
    if (helpEl.style.display === 'block' && (k === '*' || code === 106 || k === 'Enter' || code === 13)) {
      helpEl.style.display = 'none';
    } else if (k === 'ArrowUp' || code === 38) { pan(0, -step); }
    else if (k === 'ArrowDown' || code === 40) { pan(0, step); }
    else if (k === 'ArrowLeft' || code === 37) { pan(-step, 0); }
    else if (k === 'ArrowRight' || code === 39) { pan(step, 0); }
    else if (k === '1' || code === 49 || code === 97) { zoom(1); }
    else if (k === '3' || code === 51 || code === 99) { zoom(-1); }
    else if (k === '5' || k === 'Enter' || code === 53 || code === 101 || code === 13) { center(); }
    else if (k === '0' || code === 48 || code === 96) { follow = !follow; if (follow) { center(); } else { status(); } }
    else if (k === '*' || code === 106) { helpEl.style.display = helpEl.style.display === 'block' ? 'none' : 'block'; }
    else { used = false; }
    if (used && e.preventDefault) { e.preventDefault(); }
  };

  function onFix(pos) {
    var first = !me;
    me = { lat: pos.coords.latitude, lon: pos.coords.longitude,
           acc: pos.coords.accuracy, speed: pos.coords.speed };
    if (first || follow) { view.lat = me.lat; view.lon = me.lon; }
    render();
  }
  function onErr(err) {
    botEl.textContent = err.code === 1 ? 'Location blocked: allow it in the browser' :
                        err.code === 2 ? 'No GPS signal' : 'GPS timed out, retrying';
  }

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(onFix, onErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  } else {
    botEl.textContent = 'This browser has no location support';
  }

  window.onresize = render;
  render();
})();
</script>
</body>
</html>
