<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="referrer" content="origin-when-cross-origin">
<title>Flip Map</title>
<style>
  /* Full-screen map with thin bars top and bottom, built for a 240x320 keypad
     phone. Plain CSS and JS so older browsers can run it. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #1d2330; color: #f2f4f8; font-family: Arial, Helvetica, sans-serif; }
  #bar-top, #bar-bot { position: absolute; left: 0; right: 0; height: 22px; line-height: 22px;
    background: #10141d; font-size: 13px; padding: 0 4px; z-index: 5; white-space: nowrap; overflow: hidden; }
  #bar-top { top: 0; }
  #bar-bot { bottom: 0; }
  #map { position: absolute; left: 0; right: 0; top: 22px; bottom: 22px; overflow: hidden; background: #cfd8e3; }
  #tiles { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #tiles img { position: absolute; width: 256px; height: 256px; border: 0; }
  #route { position: absolute; left: 0; top: 0; z-index: 2; }
  #me { position: absolute; width: 16px; height: 16px; margin: -9px 0 0 -9px; border-radius: 50%;
    background: #1a73e8; border: 2px solid #fff; z-index: 3; display: none; }
  #cross { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; z-index: 2; opacity: .6; }
  #cross:before, #cross:after { content: ""; position: absolute; background: #222; }
  #cross:before { left: 6px; top: 0; width: 2px; height: 14px; }
  #cross:after { left: 0; top: 6px; width: 14px; height: 2px; }
  #credit { position: absolute; right: 2px; bottom: 2px; font-size: 9px; background: rgba(255,255,255,.8);
    color: #222; padding: 0 3px; z-index: 4; }
  #nav { position: absolute; left: 0; right: 0; top: 0; z-index: 4; background: rgba(16,20,29,.92);
    padding: 4px 6px; font-size: 16px; line-height: 1.25; display: none; }
  #nav .dist { color: #8ab4ff; font-weight: bold; }
  #help, #search { position: absolute; left: 0; right: 0; top: 22px; bottom: 22px; z-index: 6;
    background: rgba(16,20,29,.96); font-size: 14px; line-height: 1.5; padding: 10px; display: none; overflow: hidden; }
  #help b { color: #8ab4ff; }
  #q { width: 100%; box-sizing: border-box; font-size: 16px; padding: 4px; margin: 6px 0; }
  .res { padding: 3px 4px; font-size: 13px; line-height: 1.25; border-bottom: 1px solid #2c3446; }
  .res.sel { background: #1a73e8; }
</style>
</head>
<body>
<div id="bar-top">Starting…</div>
<div id="map">
  <div id="tiles"></div>
  <canvas id="route"></canvas>
  <div id="cross"></div>
  <div id="me"></div>
  <div id="nav"></div>
  <div id="credit">&copy; OpenStreetMap</div>
</div>
<div id="bar-bot">Waiting for GPS…</div>
<div id="help">
  <b>Keys</b><br>
  Arrows: move map<br>
  1 / 3: zoom in / out<br>
  5 or OK: center on me<br>
  0: follow me on / off<br>
  <b>8</b> or <b>#</b>: search an address<br>
  <b>7</b>: route to the + mark<br>
  <b>9</b>: cancel route<br>
  * : show / hide help<br>
  <span style="color:#9aa4b5">Version 5 (search on 8)</span>
</div>
<div id="search">
  <b>Where to?</b>
  <input id="q" type="text" placeholder="address or place">
  <div id="results"></div>
</div>

<script>
// Shows script errors on screen so a problem on the phone can be read off it.
window.onerror = function (msg, url, line) {
  var b = document.getElementById('bar-bot');
  if (b) { b.textContent = 'Error: ' + msg + ' (line ' + line + ')'; }
  return false;
};
</script>
<script>
(function () {
  var TILE = 256;
  var tilesEl = document.getElementById('tiles');
  var mapEl = document.getElementById('map');
  var meEl = document.getElementById('me');
  var topEl = document.getElementById('bar-top');
  var botEl = document.getElementById('bar-bot');
  var helpEl = document.getElementById('help');
  var navEl = document.getElementById('nav');
  var cv = document.getElementById('route');
  var searchEl = document.getElementById('search');
  var qEl = document.getElementById('q');
  var resEl = document.getElementById('results');
  var ctx = cv.getContext ? cv.getContext('2d') : null;

  // Starts near Gilbert, AZ until the GPS gets a fix.
  var view = { lat: 33.3528, lon: -111.789, z: 15 };
  var me = null;
  var follow = true;
  var lastKey = '';
  var cache = {};

  var dest = null;            // {lat, lon}
  var route = null;           // {coords, cum, steps:[{text, idx}]}
  var progressIdx = 0;
  var along = 0;              // meters travelled along the route
  var lastReroute = 0;
  var msgText = '', msgUntil = 0;

  var searchMode = null;      // null | 'input' | 'results'
  var results = [], sel = 0;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function toPx(lat, lon, z) {
    var scale = TILE * Math.pow(2, z);
    var s = Math.sin(clamp(lat, -85.05, 85.05) * Math.PI / 180);
    return { x: (lon + 180) / 360 * scale,
             y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * scale };
  }
  function toLatLon(x, y, z) {
    var scale = TILE * Math.pow(2, z);
    var n = Math.PI - 2 * Math.PI * y / scale;
    return { lat: 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))),
             lon: x / scale * 360 - 180 };
  }
  function hav(lat1, lon1, lat2, lon2) {
    var R = 6371000, r = Math.PI / 180;
    var dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  // distances come in meters; show feet under ~0.1 mi
  function fmtDist(m) {
    var ft = m * 3.281;
    if (ft < 500) { return (Math.max(10, Math.round(ft / 10) * 10)) + ' ft'; }
    return (m / 1609.34).toFixed(1) + ' mi';
  }
  function say(t) { msgText = t; msgUntil = new Date().getTime() + 6000; status(); }

  /* ---------- drawing ---------- */
  function render() {
    var w = mapEl.clientWidth, h = mapEl.clientHeight;
    var c = toPx(view.lat, view.lon, view.z);
    var left = c.x - w / 2, top = c.y - h / 2;
    var n = Math.pow(2, view.z);
    var x0 = Math.floor(left / TILE), x1 = Math.floor((left + w) / TILE);
    var y0 = Math.floor(top / TILE),  y1 = Math.floor((top + h) / TILE);
    var needed = {}, x, y, key, img;

    for (x = x0; x <= x1; x++) {
      for (y = y0; y <= y1; y++) {
        if (y < 0 || y >= n) continue;
        var wx = ((x % n) + n) % n;
        key = view.z + '/' + wx + '/' + y + '@' + x;
        needed[key] = true;
        img = cache[key];
        if (!img) {
          img = document.createElement('img');
          img.src = 'https://tile.openstreetmap.org/' + view.z + '/' + wx + '/' + y + '.png';
          img.alt = '';
          tilesEl.appendChild(img);
          cache[key] = img;
        }
        img.style.left = Math.round(x * TILE - left) + 'px';
        img.style.top = Math.round(y * TILE - top) + 'px';
      }
    }
    for (key in cache) {
      if (!needed[key]) { tilesEl.removeChild(cache[key]); delete cache[key]; }
    }

    if (me) {
      var p = toPx(me.lat, me.lon, view.z);
      var sx = p.x - left, sy = p.y - top;
      meEl.style.left = Math.round(sx) + 'px';
      meEl.style.top = Math.round(sy) + 'px';
      meEl.style.display = (sx >= -8 && sx <= w + 8 && sy >= -8 && sy <= h + 8) ? 'block' : 'none';
    }
    drawRoute(w, h, left, top);
    status();
  }

  function drawRoute(w, h, left, top) {
    if (!ctx) return;
    if (cv.width !== w) { cv.width = w; }
    if (cv.height !== h) { cv.height = h; }
    ctx.clearRect(0, 0, w, h);
    if (route) {
      var pts = route.coords, n = pts.length, stride = Math.max(1, Math.ceil(n / 600)), i, q;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      var pass;
      for (pass = 0; pass < 2; pass++) {
        ctx.strokeStyle = pass === 0 ? '#ffffff' : '#1a73e8';
        ctx.lineWidth = pass === 0 ? 9 : 5;
        ctx.beginPath();
        for (i = 0; i < n; i += stride) {
          q = toPx(pts[i][1], pts[i][0], view.z);
          if (i === 0) { ctx.moveTo(q.x - left, q.y - top); } else { ctx.lineTo(q.x - left, q.y - top); }
        }
        q = toPx(pts[n - 1][1], pts[n - 1][0], view.z);
        ctx.lineTo(q.x - left, q.y - top);
        ctx.stroke();
      }
    }
    if (dest) {
      var d = toPx(dest.lat, dest.lon, view.z);
      ctx.fillStyle = '#d93025'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(d.x - left, d.y - top, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }

  function status() {
    topEl.textContent = 'Zoom ' + view.z + (follow ? ' Follow' : ' Free') + ' v5 ' + lastKey;
    if (new Date().getTime() < msgUntil) { botEl.textContent = msgText; return; }
    if (!me) { return; }
    var mph = me.speed != null && !isNaN(me.speed) ? Math.round(me.speed * 2.23694) : null;
    var ft = me.acc != null ? Math.round(me.acc * 3.281) : null;
    botEl.textContent = (mph !== null ? mph + ' mph  ' : '') + (ft !== null ? '±' + ft + ' ft  ' : '') +
      me.lat.toFixed(4) + ', ' + me.lon.toFixed(4);
  }

  /* ---------- map controls ---------- */
  function pan(dx, dy) {
    var c = toPx(view.lat, view.lon, view.z);
    var ll = toLatLon(c.x + dx, c.y + dy, view.z);
    view.lat = clamp(ll.lat, -85, 85); view.lon = ll.lon;
    follow = false; render();
  }
  function zoom(d) { view.z = clamp(view.z + d, 3, 18); render(); }
  function center() {
    if (me) { view.lat = me.lat; view.lon = me.lon; follow = true; render(); }
    else { say('No GPS fix yet'); }
  }

  /* ---------- routing (OSRM demo server) ---------- */
  function stepText(s) {
    var m = s.maneuver || {}, t = m.type, mod = m.modifier, name = s.name || '';
    var base;
    if (t === 'arrive') { return 'Arrive at destination'; }
    if (t === 'roundabout' || t === 'rotary') { base = 'Roundabout, exit ' + (m.exit || ''); }
    else if (t === 'merge') { base = 'Merge' + (mod ? ' ' + mod : ''); }
    else if (t === 'on ramp') { base = 'Take ramp' + (mod ? ' ' + mod : ''); }
    else if (t === 'off ramp') { base = 'Take exit' + (mod ? ' ' + mod : ''); }
    else if (t === 'fork') { base = 'Keep ' + (mod || 'straight'); }
    else if (t === 'continue' || t === 'new name' || mod === 'straight') { base = 'Continue straight'; }
    else if (t === 'depart') { base = 'Head out'; }
    else { base = 'Turn' + (mod ? ' ' + mod : ''); }
    return base + (name ? ' onto ' + name : '');
  }

  function setRoute(r) {
    var coords = r.geometry.coordinates, cum = [0], i, j;
    for (i = 1; i < coords.length; i++) {
      cum.push(cum[i - 1] + hav(coords[i - 1][1], coords[i - 1][0], coords[i][1], coords[i][0]));
    }
    var raw = (r.legs && r.legs[0] && r.legs[0].steps) || [], steps = [], prev = 0;
    for (i = 0; i < raw.length; i++) {
      var loc = raw[i].maneuver.location, best = prev, bd = 1e12, d;
      for (j = prev; j < coords.length; j++) {
        d = hav(loc[1], loc[0], coords[j][1], coords[j][0]);
        if (d < bd) { bd = d; best = j; }
        if (d < 3) { break; }
      }
      prev = best;
      steps.push({ text: stepText(raw[i]), idx: best });
    }
    route = { coords: coords, cum: cum, steps: steps };
    progressIdx = 0; along = 0;
    say('Route: ' + fmtDist(r.distance));
    updateNav(); render();
  }

  function requestRoute() {
    if (!me || !dest) { say('Need a GPS fix first'); return; }
    var url = 'https://router.project-osrm.org/route/v1/driving/' +
      me.lon.toFixed(6) + ',' + me.lat.toFixed(6) + ';' + dest.lon.toFixed(6) + ',' + dest.lat.toFixed(6) +
      '?overview=full&geometries=geojson&steps=true';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) { return; }
      if (xhr.status === 200) {
        try {
          var d = JSON.parse(xhr.responseText);
          if (d.code === 'Ok' && d.routes && d.routes.length) { setRoute(d.routes[0]); }
          else { say('No route found'); }
        } catch (e) { say('Route reply unreadable'); }
      } else { say('Route server error ' + xhr.status); }
    };
    say('Finding route…');
    xhr.send();
  }

  function setDest(lat, lon) {
    dest = { lat: lat, lon: lon };
    route = null; navEl.style.display = 'none';
    requestRoute(); render();
  }
  function cancelRoute() {
    dest = null; route = null; navEl.style.display = 'none';
    say('Route cancelled'); render();
  }

  // distance in meters from point to segment a-b, plus position t (0..1) along it
  function segInfo(lat, lon, a, b) {
    var kx = Math.cos(lat * Math.PI / 180) * 111320, ky = 110540;
    var ax = (a[0] - lon) * kx, ay = (a[1] - lat) * ky;
    var bx = (b[0] - lon) * kx, by = (b[1] - lat) * ky;
    var dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
    var t = len2 > 0 ? clamp(-(ax * dx + ay * dy) / len2, 0, 1) : 0;
    var px = ax + t * dx, py = ay + t * dy;
    return { d: Math.sqrt(px * px + py * py), t: t };
  }

  function updateProgress() {
    if (!route || !me) { return; }
    var c = route.coords, n = c.length, i, info, bd = 1e12, bi = 0, bt = 0;
    var from = Math.max(0, progressIdx - 3), to = Math.min(n - 2, progressIdx + 80);
    for (i = from; i <= to; i++) {
      info = segInfo(me.lat, me.lon, c[i], c[i + 1]);
      if (info.d < bd) { bd = info.d; bi = i; bt = info.t; }
    }
    if (bd > 80) {
      for (i = 0; i <= n - 2; i++) {
        info = segInfo(me.lat, me.lon, c[i], c[i + 1]);
        if (info.d < bd) { bd = info.d; bi = i; bt = info.t; }
      }
    }
    if (bd > 80) {
      var now = new Date().getTime();
      if (now - lastReroute > 20000) { lastReroute = now; say('Off route, rerouting…'); requestRoute(); }
      return;
    }
    progressIdx = bi;
    along = route.cum[bi] + bt * (route.cum[bi + 1] - route.cum[bi]);
    if (dest && hav(me.lat, me.lon, dest.lat, dest.lon) < 40) {
      say('You have arrived');
      dest = null; route = null; navEl.style.display = 'none';
    }
  }

  function updateNav() {
    if (!route) { navEl.style.display = 'none'; return; }
    var i, s = route.steps, next = null;
    for (i = 1; i < s.length; i++) {
      if (route.cum[s[i].idx] > along + 5) { next = s[i]; break; }
    }
    if (!next) { next = s[s.length - 1]; }
    var d = Math.max(0, route.cum[next.idx] - along);
    var total = route.cum[route.cum.length - 1] - along;
    navEl.innerHTML = '<span class="dist">' + fmtDist(d) + '</span> ' + next.text +
      '<br><span style="font-size:12px;color:#9aa4b5">' + fmtDist(Math.max(0, total)) + ' to go</span>';
    navEl.style.display = 'block';
  }

  /* ---------- address search (Nominatim) ---------- */
  function openSearch() {
    searchMode = 'input'; results = []; sel = 0;
    resEl.innerHTML = ''; qEl.value = '';
    searchEl.style.display = 'block'; qEl.focus();
  }
  function closeSearch() {
    searchMode = null; searchEl.style.display = 'none'; qEl.blur();
  }
  function showResults() {
    var html = '', i;
    for (i = 0; i < results.length; i++) {
      var name = results[i].display_name || 'Unnamed place';
      html += '<div class="res' + (i === sel ? ' sel' : '') + '">' +
        name.replace(/&/g, '&amp;').replace(/</g, '&lt;').substring(0, 60) + '</div>';
    }
    html += '<div class="res' + (sel === results.length ? ' sel' : '') + '">Cancel</div>';
    resEl.innerHTML = html;
  }
  function doSearch(q) {
    resEl.innerHTML = '<div class="res">Searching…</div>';
    var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&q=' + encodeURIComponent(q);
    if (me) {
      url += '&viewbox=' + (me.lon - 0.6).toFixed(4) + ',' + (me.lat + 0.6).toFixed(4) + ',' +
             (me.lon + 0.6).toFixed(4) + ',' + (me.lat - 0.6).toFixed(4);
    }
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) { return; }
      if (xhr.status === 200) {
        try { results = JSON.parse(xhr.responseText); } catch (e) { results = []; }
        if (!results.length) { resEl.innerHTML = '<div class="res">Nothing found. Edit and press OK.</div>'; return; }
        searchMode = 'results'; sel = 0; qEl.blur(); showResults();
      } else { resEl.innerHTML = '<div class="res">Search error ' + xhr.status + '</div>'; }
    };
    xhr.send();
  }
  // returns true when the key was used by the search screen
  function searchKey(e) {
    var k = e.key, code = e.keyCode;
    var isEnter = (k === 'Enter' || code === 13);
    if (searchMode === 'results') {
      if (k === 'ArrowUp' || code === 38) { sel = (sel + results.length) % (results.length + 1); showResults(); }
      else if (k === 'ArrowDown' || code === 40) { sel = (sel + 1) % (results.length + 1); showResults(); }
      else if (isEnter) {
        if (sel < results.length) {
          var r = results[sel];
          closeSearch();
          setDest(parseFloat(r.lat), parseFloat(r.lon));
        } else { searchMode = 'input'; qEl.focus(); }
      }
      return true;
    }
    if (isEnter) {
      var q = qEl.value.replace(/^\s+|\s+$/g, '');
      if (!q) { closeSearch(); } else { doSearch(q); }
      return true;
    }
    return false;   // let the text box take typing
  }

  /* ---------- keys ---------- */
  document.onkeydown = function (e) {
    e = e || window.event;
    lastKey = (e.key || '?') + '/' + (e.keyCode || e.which || '?');
    status();
    if (searchMode) { if (searchKey(e) && e.preventDefault) { e.preventDefault(); } return; }
    var k = e.key, code = e.keyCode || e.which, step = 64, used = true;
    if (k === 'Unidentified' || k === 'Process') { k = ''; }
    if (!k && e.code) {
      var m = /^(?:Digit|Numpad)([0-9])$/.exec(e.code);
      if (m) { k = m[1]; }
    }
    if (helpEl.style.display === 'block' && (k === '*' || code === 106 || k === 'Enter' || code === 13)) {
      helpEl.style.display = 'none';
    } else if (k === 'ArrowUp' || code === 38) { pan(0, -step); }
    else if (k === 'ArrowDown' || code === 40) { pan(0, step); }
    else if (k === 'ArrowLeft' || code === 37) { pan(-step, 0); }
    else if (k === 'ArrowRight' || code === 39) { pan(step, 0); }
    else if (k === '1' || code === 49 || code === 97) { zoom(1); }
    else if (k === '3' || code === 51 || code === 99) { zoom(-1); }
    else if (k === '5' || k === 'Enter' || code === 53 || code === 101 || code === 13) { center(); }
    else if (k === '0' || code === 48 || code === 96) { follow = !follow; if (follow) { center(); } else { status(); } }
    else if (k === '7' || code === 55 || code === 103) { setDest(view.lat, view.lon); }
    else if (k === '9' || code === 57 || code === 105) { cancelRoute(); }
    else if (k === '#' || k === '8' || code === 56 || code === 104) { openSearch(); }
    else if (k === '*' || code === 106) { helpEl.style.display = helpEl.style.display === 'block' ? 'none' : 'block'; }
    else { used = false; }
    if (used && e.preventDefault) { e.preventDefault(); }
  };

  /* ---------- GPS ---------- */
  function onFix(pos) {
    var first = !me;
    me = { lat: pos.coords.latitude, lon: pos.coords.longitude,
           acc: pos.coords.accuracy, speed: pos.coords.speed };
    if (first || follow) { view.lat = me.lat; view.lon = me.lon; }
    updateProgress(); updateNav(); render();
  }
  function onErr(err) {
    botEl.textContent = err.code === 1 ? 'Location blocked: allow it in the browser' :
                        err.code === 2 ? 'No GPS signal' : 'GPS timed out, retrying';
  }
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(onFix, onErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  } else {
    botEl.textContent = 'This browser has no location support';
  }

  window.onresize = render;
  render();
})();
</script>
</body>
</html>
